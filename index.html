var $ = function (s) { return document.querySelector(s); };
var app = $("#app");
var AR = false;
try { AR = localStorage.getItem("hl") === "ar"; } catch (e) {}

var t  = function (s) { return AR && TEXT_AR[s] ? TEXT_AR[s] : s; };
var bi = function (en, ar) { return AR ? ar : en; };
var slug = function (s) { return String(s).trim().toLowerCase().replace(/[_\s]+/g, "-"); };
var pad4 = function (n) { return ("000" + n).slice(-4); };
var esc = function (s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
};
function nm(x) {                       // الاسم: نص أو {en, ar}
  if (x && typeof x === "object") return AR ? (x.ar || x.en || "") : (x.en || x.ar || "");
  return x || "";
}
function fmtDate(d) {
  var p = new Date(d + "T00:00:00");
  return isNaN(p) ? d : p.toLocaleDateString(AR ? "ar-EG-u-nu-latn" : "en-GB",
    { day: "2-digit", month: "short", year: "numeric" });
}
function addMonths(iso, n) {
  var d = new Date(iso + "T00:00:00Z");
  d.setUTCMonth(d.getUTCMonth() + n);
  return d.toISOString().slice(0, 10);
}

/* =====================================================================
   4) الأرقام التعريفية والسجلات
   صيغة الرقم: HLMO-WN-{رمز المكتب}{الدرجة}-{تسلسل}   مثل HLMO-WN-PM2-0001
   الدرجة: 1 مدير · 2 مساعد · 3 عضو · V متطوع مكتب   |   متطوع عام: HLMO-WN-VOL-0001
   ===================================================================== */
var SHEET = {};        // بيانات قاعدة البيانات (إن وُجدت)
var OV = {};           // الاستثناءات بعد التطبيع

function parseId(h) {
  var s = CONFIG.state.toLowerCase();
  var m = h.match(new RegExp("^hlmo-" + s + "-vol-(\\d{4})$"));
  if (m) return { office: null, grade: "VOL", seq: +m[1] };
  m = h.match(new RegExp("^hlmo-" + s + "-([a-z]{2})([123v])-(\\d{4})$"));
  if (!m) return null;
  var office = OFFICES.filter(function (o) {
    return o.codes.some(function (c) { return c.toLowerCase() === m[1]; });
  })[0];
  return office ? { office: office, grade: m[2].toUpperCase(), seq: +m[3] } : null;
}
function makeId(p) {
  var base = "HLMO-" + CONFIG.state + "-";
  return p.grade === "VOL" ? base + "VOL-" + pad4(p.seq)
                           : base + p.office.codes[0] + p.grade + "-" + pad4(p.seq);
}
Object.keys(OVERRIDES).forEach(function (k) {
  var p = parseId(slug(k));
  OV[p ? slug(makeId(p)) : slug(k)] = OVERRIDES[k];
});

function describe(p) {                 // المسمى والقسم ونطاق المهام الافتراضية
  var o = p.office;
  if (p.grade === "VOL") return {
    role: bi("General State Volunteer", "متطوع عام بالولاية"),
    dept: bi("State Volunteers", "متطوعو الولاية"),
    scope: bi(CONFIG.volunteerScope, CONFIG.volunteerScopeAr) };
  var scope = bi(o.scope, o.scopeAr), office = bi(o.en, o.ar);
  if (p.grade === "1") return { role: bi(o.role, o.roleAr), dept: t("Administration"), scope: scope };
  if (p.grade === "2") return { role: bi("Assistant Manager — ", "مساعد مدير — ") + office, dept: office, scope: scope };
  if (p.grade === "3") return { role: bi("Member — ", "عضو — ") + office, dept: office, scope: scope };
  return { role: bi("Volunteer — ", "متطوع — ") + office, dept: office,
           scope: bi(CONFIG.volunteerScope, CONFIG.volunteerScopeAr) };
}
/* يفصل نصاً ثنائي اللغة بالشكل: English text | النص العربي (بأي ترتيب) */
function pickLang(x) {
  x = String(x || "").trim();
  var i = x.indexOf("|");
  if (i < 0) return x;
  var a = x.slice(0, i).trim(), b = x.slice(i + 1).trim();
  var isAr = function (z) { return /[\u0600-\u06FF]/.test(z); };
  var ar = isAr(a) && !isAr(b) ? a : isAr(b) && !isAr(a) ? b : b;
  var en = ar === a ? b : a;
  return (AR ? ar || en : en || ar);
}
/* يحوّل رابط مشاركة Google Drive إلى روابط صور قابلة للعرض (تُجرَّب بالترتيب) */
function photoList(u) {
  u = String(u || "").trim();
  if (!u) return [];
  var m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/(?:open|uc|thumbnail)\?(?:[^#]*&)?id=([\w-]+)/) ||
          u.match(/docs\.google\.com\/.*\/d\/([\w-]+)/) || u.match(/lh3\.googleusercontent\.com\/d\/([\w-]+)/);
  if (m) {
    var id = m[1];
    return ["https://drive.google.com/thumbnail?id=" + id + "&sz=w800",
            "https://lh3.googleusercontent.com/d/" + id + "=w800",
            "https://drive.google.com/uc?export=view&id=" + id];
  }
  return /^(https?:|data:image\/)/i.test(u) ? [u] : [];
}
function findRecord(h) {
  var p = parseId(h);
  if (!p) return null;
  var id = makeId(p), k = slug(id);
  var sheet = SHEET[k];
  if (!sheet) return null;                       // الجدول هو المصدر الوحيد
  var ov = Object.assign({}, OV[k], sheet);
  var d = describe(p), issue = ov.issue || CONFIG.issueDate;
  return {
    id: id, name: nm(sheet.name || ""),
    role: ov.role || d.role, dept: ov.dept || d.dept, scope: pickLang(ov.scope) || d.scope,
    issue: issue, expiry: ov.expiry || addMonths(issue, CONFIG.validMonths),
    status: ov.status || "active", ended: ov.ended || "",
    photos: photoList(PHOTOS[ov.photo] || ov.photo)
  };
}

/* =====================================================================
   5) الربط مع قاعدة البيانات (Google Sheets منشور كـ CSV)
   الأعمدة المقروءة بالاسم: «المعرّف المؤسسي (ID)» و«الاسم الكامل» (مطلوبان)،
   واختيارياً: الحالة · تاريخ الإصدار · تاريخ الانتهاء (وهي موجودة في صفحة Site)
   ===================================================================== */
var SHEET_COLS = {
  id: ["(ID)"], name: ["الاسم"], status: ["الحالة"], photo: ["الصورة"], scope: ["نطاق العمل"],
  issue: ["تاريخ الإصدار"], expiry: ["تاريخ الانتهاء"], ended: ["إنهاء العلاقة", "تاريخ إنهاء"]
};
var STATE = "loading";   // loading | ready | error
function isoDate(s) {                  // يقبل 2026-08-26 أو 2026/8/26
  var m = String(s).match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  return m ? m[1] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2) : "";
}
function parseCsv(s) {
  var rows = [], row = [], f = "", q = false, i, c;
  for (i = 0; i < s.length; i++) {
    c = s[i];
    if (q) {
      if (c === '"') { if (s[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && s[i + 1] === "\n") i++;
      row.push(f); rows.push(row); row = []; f = "";
    } else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function ingestRows(rows, into) {
  var hi = -1, col = {}, n = 0;
  rows.some(function (r, i) {
    if (r.some(function (c) { return c.indexOf("(ID)") > -1; }) &&
        r.some(function (c) { return c.trim().indexOf("الاسم") === 0; })) { hi = i; return true; }
  });
  if (hi < 0) return 0;
  Object.keys(SHEET_COLS).forEach(function (k) {
    col[k] = rows[hi].findIndex(function (h) {
      return SHEET_COLS[k].some(function (w) { return h.indexOf(w) > -1; });
    });
  });
  rows.slice(hi + 1).forEach(function (r) {
    var get = function (k) { return col[k] > -1 ? (r[col[k]] || "").trim() : ""; };
    var p = parseId(slug(get("id")));
    if (!p) return;
    var e = { name: get("name") }, st = get("status");     // الاسم الفارغ = رقم محجوز
    if (/ملغ|غير نشط|inactive/i.test(st)) e.status = "inactive";
    ["issue", "expiry", "ended"].forEach(function (k) { var d = isoDate(get(k)); if (d) e[k] = d; });
    if (get("photo")) e.photo = get("photo");
    if (get("scope")) e.scope = get("scope");
    into[slug(makeId(p))] = e; n++;
  });
  return n;
}
function loadSheets() {
  var urls = (CONFIG.sheetUrls || []).filter(Boolean), fresh = {}, total = 0;
  if (!urls.length) return Promise.reject(new Error("no url"));
  return Promise.all(urls.map(function (u) {
    var url = u + (u.indexOf("?") > -1 ? "&" : "?") + "t=" + Date.now();
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.text();
    }).then(function (txt) { total += ingestRows(parseCsv(txt), fresh); });
  })).then(function () {
    if (!total) throw new Error("empty");
    SHEET = fresh;
  });
}

           "انتهت علاقة حامل هذه البطاقة بالمنظمة" + (m.ended ? " بتاريخ " + fmtDate(m.ended) : "") +
           "، ولم يعد مخولاً بتمثيلها أو تنفيذ أي مهام باسمها.");
    body = row("Card ID", m.id) + `<div class="nt" style="border-color:var(--bad)">${why}</div>`;
  }
  app.innerHTML = top + `<div class="sb ${cls}">${msg}</div>${avatar}<h1 class="nm">${esc(m.name)}</h1>` +
    (valid ? `<div class="rl"><span>${esc(m.role)}</span></div>` : "") + body + footer();
}

   7) التوجيه والتشغيل

function route() {
  var h = "";
  try { h = slug(decodeURIComponent(location.hash.slice(1))); } catch (e) { h = slug(location.hash.slice(1)); }
  window.scrollTo(0, 0);
  document.documentElement.lang = AR ? "ar" : "en";
  app.dir = AR ? "rtl" : "ltr";
  if (!h || h === "home") renderHome(); else renderMember(h);
}
function boot() {
  STATE = "loading"; route();
  loadSheets().then(function () { STATE = "ready"; route(); })
              .catch(function () { STATE = "error"; route(); });
}
function init() {
  ["icon", "apple-touch-icon"].forEach(function (rel) {
    var l = document.createElement("link"); l.rel = rel; l.href = LOGO; document.head.appendChild(l);
  });
  window.addEventListener("hashchange", route);
  boot();
}
document.addEventListener("DOMContentLoaded", init);
</script>
